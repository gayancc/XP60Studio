[workspace]
resolver = "2"
default-members = ["crates/xppatch-sysex", "crates/xppatch-core", "crates/xppatch-midi", "crates/xppatch-wasm", "crates/xppatch-library"]
members = ["crates/xppatch-sysex", "crates/xppatch-core", "crates/xppatch-midi", "crates/xppatch-wasm", "crates/xppatch-app", "crates/xppatch-library"]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.89"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
